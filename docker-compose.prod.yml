# Production stack for the Hostinger VPS, driven by Jenkins (see Jenkinsfile).
#
# Run with the server-side env file so ${PG_*} / ${APP_DOMAIN} are interpolated:
#   docker compose -p ticketing-backend -f docker-compose.prod.yml \
#     --env-file /opt/ticketing/backend.env up -d --wait
#
# The API has no host port: Traefik (deploy/traefik) finds every "app" replica
# on the shared "traefik" network and load-balances https://APP_DOMAIN/api/*
# across the healthy ones. Postgres stays on 127.0.0.1:5432 for SSH tunnels.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-ticketing_system}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USERNAME} -d ${PG_DB:-ticketing_system}']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticketing-backend:latest
    # no container_name / host port: both would block running several replicas
    restart: unless-stopped
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    env_file:
      - /opt/ticketing/backend.env
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_HOST: postgres
      PG_PORT: 5432
      UPLOAD_DIR: ./uploads
    volumes:
      # Shared by all replicas, so an image saved by one is served by every one.
      - /opt/ticketing/uploads:/app/uploads
      # Optional secrets (e.g. firebase-service-account.json)
      - /opt/ticketing/secrets:/app/secrets:ro
    networks:
      - default
      - traefik
    healthcheck:
      # Traefik only sends traffic to containers Docker reports as healthy
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3000/auth/healthCheck || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      # https://APP_DOMAIN/api/... -> replica:3000/... (prefix stripped, as before)
      - traefik.http.routers.ticketing-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.ticketing-api.entrypoints=websecure
      - traefik.http.routers.ticketing-api.tls.certresolver=le
      - traefik.http.routers.ticketing-api.middlewares=ticketing-api-strip
      - traefik.http.middlewares.ticketing-api-strip.stripprefix.prefixes=/api
      # round-robin across replicas; Traefik also probes each one itself
      - traefik.http.services.ticketing-api.loadbalancer.server.port=3000
      - traefik.http.services.ticketing-api.loadbalancer.healthcheck.path=/auth/healthCheck
      - traefik.http.services.ticketing-api.loadbalancer.healthcheck.interval=10s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  pgdata:
    name: ticketing_pgdata

networks:
  traefik:
    name: traefik
    external: true
