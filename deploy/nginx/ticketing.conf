# Host nginx on the VPS -> /etc/nginx/sites-available/ticketing
# (setup-vps.sh installs and enables it).
#
#   http://<server>/        -> frontend container  (127.0.0.1:4001)
#   http://<server>/api/... -> backend container   (127.0.0.1:3000), /api prefix stripped
#
# The frontend is built with VITE_API_BASE_URL=/api, so browser and API share
# one origin (no CORS issues, one TLS certificate later).
# When you have a domain: set server_name, then run
#   certbot --nginx -d your.domain
# and update ALLOWED_ORIGINS in /opt/ticketing/backend.env + the frontend job.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Ticket / NCR photo uploads
    client_max_body_size 25M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
    }
}
